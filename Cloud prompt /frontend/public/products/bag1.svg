<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Tan Vegan Leather Sling Bag">
  <defs>
    <linearGradient id="bg-bag1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg-bag1)"/>
  <circle cx="300" cy="285" r="210" fill="#ffffff" opacity="0.65"/>
  <!-- Demo Merchandise Transparency Badge -->
  <rect x="24" y="24" width="180" height="32" rx="16" fill="#1f2937" opacity="0.82"/>
  <text x="114" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.8">DEMO CATALOG ITEM</text>
  
  
      <g >
        <!-- Crossbody Strap -->
        <path d="M215 245 Q300 85 385 245" fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round"/>
        <!-- Bag Body -->
        <rect x="195" y="230" width="210" height="165" rx="28" fill="#92400e" stroke="#b45309" stroke-width="4"/>
        <!-- Flap -->
        <path d="M198 242 L402 242 L390 315 Q300 345 210 315 Z" fill="#b45309" stroke="#fbbf24" stroke-width="2.5"/>
        <!-- Brass Buckle -->
        <circle cx="300" cy="318" r="18" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
        <circle cx="300" cy="318" r="7" fill="#92400e"/>
      </g>
    
  <!-- Bottom Caption Card -->
  <rect x="40" y="492" width="520" height="80" rx="16" fill="#ffffff" opacity="0.92"/>
  <text x="300" y="526" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Tan Vegan Leather Sling Bag</text>
  <text x="300" y="553" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Crossbody Adjustable Strap • Brass Clasp</text>
</svg>