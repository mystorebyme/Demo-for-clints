<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Embroidered Bridal Potli Bag">
  <defs>
    <linearGradient id="bg-bag2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg-bag2)"/>
  <circle cx="300" cy="285" r="210" fill="#ffffff" opacity="0.65"/>
  <!-- Demo Merchandise Transparency Badge -->
  <rect x="24" y="24" width="180" height="32" rx="16" fill="#1f2937" opacity="0.82"/>
  <text x="114" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.8">DEMO CATALOG ITEM</text>
  <rect x="440" y="24" width="136" height="32" rx="16" fill="#9f1239" opacity="0.9"/><text x="508" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">FABRIC DETAIL</text>
  
      <g transform="scale(1.18) translate(-45, -45)">
        <!-- Pearl Handle -->
        <path d="M245 195 Q300 105 355 195" fill="none" stroke="#fcd34d" stroke-width="10" stroke-dasharray="2 14" stroke-linecap="round"/>
        <!-- Potli Pouch -->
        <path d="M245 195 L355 195 L335 230 Q415 310 380 395 Q300 435 220 395 Q185 310 265 230 Z"
              fill="#9f1239" stroke="#fcd34d" stroke-width="3"/>
        <!-- Drawstring & Tassels -->
        <line x1="255" y1="230" x2="345" y2="230" stroke="#fcd34d" stroke-width="5"/>
        <line x1="340" y1="230" x2="365" y2="305" stroke="#fcd34d" stroke-width="3"/>
        <circle cx="365" cy="312" r="9" fill="#fcd34d"/>
        <!-- Zardosi Motif -->
        <circle cx="300" cy="325" r="36" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="6 4"/>
        <circle cx="300" cy="325" r="14" fill="#fcd34d" opacity="0.85"/>
      </g>
    
  <!-- Bottom Caption Card -->
  <rect x="40" y="492" width="520" height="80" rx="16" fill="#ffffff" opacity="0.92"/>
  <text x="300" y="526" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Embroidered Bridal Potli Bag</text>
  <text x="300" y="553" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Zardosi & Pearl Handle Drawstring Pouch</text>
</svg>